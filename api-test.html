<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student API Tester</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
    }

    h1, h2 {
      margin-top: 0;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, button, select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #0f766e;
    }

    button.secondary:hover {
      background: #115e59;
    }

    button.danger {
      background: #dc2626;
    }

    button.danger:hover {
      background: #b91c1c;
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 12px 0 0;
    }

    .message {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      display: none;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Student Management API Tester</h1>
      <p>Use this page to test the API responses directly in the browser.</p>
    </div>

    <div class="card">
      <h2>Get All Students</h2>
      <button id="getAllBtn">GET /students</button>
      <pre id="allStudentsOutput">{}</pre>
    </div>

    <div class="card">
      <h2>Get Student by ID</h2>
      <div class="row">
        <input id="studentIdInput" type="number" placeholder="Student ID" />
        <button id="getOneBtn">GET /students/:id</button>
      </div>
      <pre id="singleStudentOutput">{}</pre>
    </div>

    <div class="card">
      <h2>Create Student</h2>
      <div class="row">
        <input id="nameInput" type="text" placeholder="Name" />
        <input id="courseInput" type="text" placeholder="Course" />
        <input id="yearInput" type="number" min="1" max="6" placeholder="Year" />
        <button id="createBtn">POST /students</button>
      </div>
      <pre id="createOutput">{}</pre>
    </div>

    <div class="card">
      <h2>Update Student</h2>
      <div class="row">
        <input id="updateIdInput" type="number" placeholder="Student ID" />
        <input id="updateNameInput" type="text" placeholder="New Name" />
        <input id="updateCourseInput" type="text" placeholder="New Course" />
        <input id="updateYearInput" type="number" min="1" max="6" placeholder="New Year" />
        <button id="updateBtn" class="secondary">PUT /students/:id</button>
      </div>
      <pre id="updateOutput">{}</pre>
    </div>

    <div class="card">
      <h2>Delete Student</h2>
      <div class="row">
        <input id="deleteIdInput" type="number" placeholder="Student ID" />
        <button id="deleteBtn" class="danger">DELETE /students/:id</button>
      </div>
      <pre id="deleteOutput">{}</pre>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.startsWith('file://') ? 'http://localhost:3000' : window.location.origin;

    function showOutput(element, data, isError = false) {
      element.textContent = JSON.stringify(data, null, 2);
      if (isError) {
        element.style.background = '#fef2f2';
        element.style.color = '#b91c1c';
      } else {
        element.style.background = '#0f172a';
        element.style.color = '#e2e8f0';
      }
    }

    async function request(url, options = {}) {
      try {
        const response = await fetch(url, {
          headers: {
            'Content-Type': 'application/json'
          },
          ...options
        });

        const data = await response.json();
        return { response, data };
      } catch (error) {
        return {
          response: { ok: false },
          data: { success: false, message: error.message || 'Network error' }
        };
      }
    }

    document.getElementById('getAllBtn').addEventListener('click', async () => {
      const { response, data } = await request(`${API_BASE}/students`);
      showOutput(document.getElementById('allStudentsOutput'), response.ok ? data : data);
    });

    document.getElementById('getOneBtn').addEventListener('click', async () => {
      const id = document.getElementById('studentIdInput').value;
      if (!id) {
        showOutput(document.getElementById('singleStudentOutput'), { error: 'Please enter a student ID' });
        return;
      }
      const { data } = await request(`${API_BASE}/students/${id}`);
      showOutput(document.getElementById('singleStudentOutput'), data);
    });

    document.getElementById('createBtn').addEventListener('click', async () => {
      const payload = {
        name: document.getElementById('nameInput').value.trim(),
        course: document.getElementById('courseInput').value.trim(),
        year: Number(document.getElementById('yearInput').value)
      };

      if (!payload.name || !payload.course || !Number.isInteger(payload.year)) {
        showOutput(document.getElementById('createOutput'), { error: 'Please enter valid name, course, and year values.' });
        return;
      }

      const { data } = await request(`${API_BASE}/students`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      showOutput(document.getElementById('createOutput'), data);
    });

    document.getElementById('updateBtn').addEventListener('click', async () => {
      const id = document.getElementById('updateIdInput').value;
      const payload = {
        name: document.getElementById('updateNameInput').value.trim(),
        course: document.getElementById('updateCourseInput').value.trim(),
        year: Number(document.getElementById('updateYearInput').value)
      };

      if (!id || !payload.name || !payload.course || !Number.isInteger(payload.year)) {
        showOutput(document.getElementById('updateOutput'), { error: 'Please enter a valid ID, name, course, and year.' });
        return;
      }

      const { data } = await request(`${API_BASE}/students/${id}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
      showOutput(document.getElementById('updateOutput'), data);
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      const id = document.getElementById('deleteIdInput').value;
      if (!id) {
        showOutput(document.getElementById('deleteOutput'), { error: 'Please enter a student ID.' });
        return;
      }

      const { data } = await request(`${API_BASE}/students/${id}`, {
        method: 'DELETE'
      });
      showOutput(document.getElementById('deleteOutput'), data);
    });
  </script>
</body>
</html>
